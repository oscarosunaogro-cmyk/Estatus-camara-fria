let estados = {}; // id -> {optima, fechaFalla, numeroReporte, fechaSolucion}
let filtro = { texto: "", region: "", estatus: "" };

const elLista = document.getElementById("lista");
const elBuscar = document.getElementById("buscar");
const elRegion = document.getElementById("filtroRegion");
const elEstatus = document.getElementById("filtroEstatus");

// Poblar filtro de regiones
[...new Set(TIENDAS.map(t => t.region))].sort().forEach(r => {
  const o = document.createElement("option"); o.value = r; o.textContent = r; elRegion.appendChild(o);
});

function defaultEstado(){ return { optima: true, fechaFalla: "", numeroReporte: "", usuario: "" }; }

function actualizarHeader(){
  const total = TIENDAS.length;
  const conFalla = TIENDAS.filter(t => !(estados[t.id] || defaultEstado()).optima).length;
  document.getElementById("totalTiendas").textContent = total;
  document.getElementById("conFalla").textContent = conFalla;
  document.getElementById("habilitadas").textContent = total - conFalla;
  document.getElementById("barra").style.width = ((total - conFalla) / total * 100).toFixed(0) + "%";
}

function render(){
  elLista.innerHTML = "";
  const texto = filtro.texto.trim().toLowerCase();
  const filtradas = TIENDAS.filter(t => {
    const est = estados[t.id] || defaultEstado();
    if (filtro.region && t.region !== filtro.region) return false;
    if (filtro.estatus === "ok" && !est.optima) return false;
    if (filtro.estatus === "falla" && est.optima) return false;
    if (texto && !(`${t.nombre} ${t.id} ${t.zona}`.toLowerCase().includes(texto))) return false;
    return true;
  });

  const porZona = {};
  filtradas.forEach(t => { (porZona[t.zona] = porZona[t.zona] || []).push(t); });
  const zonasOrdenadas = Object.keys(porZona).sort();

  const tplGrupo = document.getElementById("tplGrupo");
  const tplTienda = document.getElementById("tplTienda");

  zonasOrdenadas.forEach(zona => {
    const grupo = tplGrupo.content.cloneNode(true);
    grupo.querySelector(".grupo-titulo").textContent = zona;
    const arr = porZona[zona];
    const ok = arr.filter(t => (estados[t.id] || defaultEstado()).optima).length;
    grupo.querySelector(".grupo-contador").textContent = `${ok}/${arr.length} óptimas`;
    const cont = grupo.querySelector(".grupo-tiendas");
    arr.forEach(t => cont.appendChild(crearTarjeta(t)));
    elLista.appendChild(grupo);
  });

  actualizarHeader();
}

function crearTarjeta(t){
  const tpl = document.getElementById("tplTienda");
  const node = tpl.content.cloneNode(true);
  const card = node.querySelector(".tienda-card");
  const est = estados[t.id] || defaultEstado();

  node.querySelector(".nombre").textContent = t.nombre;
  node.querySelector(".id").textContent = "ID " + t.id;
  node.querySelector(".zona").textContent = t.zona;

  const chk = node.querySelector(".switch-optima");
  const track = node.querySelector(".switch-track");
  const thumb = node.querySelector(".switch-thumb");
  const dot = node.querySelector(".dot");
  const estadoTxt = node.querySelector(".estado-txt");
  const form = node.querySelector(".form-falla");
  const inFecha = node.querySelector(".in-fecha-falla");
  const inReporte = node.querySelector(".in-reporte");
  const inUsuario = node.querySelector(".in-usuario");
  const btnGuardar = node.querySelector(".btn-guardar");
  const msg = node.querySelector(".msg-guardado");

  inFecha.value = est.fechaFalla || "";
  inReporte.value = est.numeroReporte || "";
  inUsuario.value = est.usuario || "";

  function pintar(){
    chk.checked = est.optima;
    card.classList.toggle("card-ok", est.optima);
    card.classList.toggle("card-bad", !est.optima);
    dot.classList.toggle("dot-ok", est.optima);
    dot.classList.toggle("dot-bad", !est.optima);
    estadoTxt.textContent = est.optima ? "Óptimas" : "Con fallas";
    track.classList.toggle("bg-green-500", est.optima);
    track.classList.toggle("bg-red-400", !est.optima);
    thumb.style.transform = est.optima ? "translateX(16px)" : "translateX(0px)";
    form.classList.toggle("hidden", est.optima);
  }
  pintar();

  chk.addEventListener("change", () => {
    if (chk.checked){
      // Reactivar: se conserva el historial de la última falla reportada
      guardar({ optima: true });
    } else {
      est.optima = false; pintar();
    }
  });

  btnGuardar.addEventListener("click", () => {
    if (!inFecha.value || !inReporte.value || !inUsuario.value){
      alert("Fecha/hora de falla, número de reporte y usuario son obligatorios.");
      return;
    }
    guardar({ optima: false, fechaFalla: inFecha.value, numeroReporte: inReporte.value, usuario: inUsuario.value });
    msg.classList.remove("hidden");
    setTimeout(() => msg.classList.add("hidden"), 2000);
  });

  function guardar(datos){
    col.doc(String(t.id)).set({
      id: t.id, nombre: t.nombre, region: t.region, zona: t.zona,
      ...datos, actualizado: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true }).catch(err => alert("Error al guardar: " + err.message));
  }

  return node;
}

elBuscar.addEventListener("input", e => { filtro.texto = e.target.value; render(); });
elRegion.addEventListener("change", e => { filtro.region = e.target.value; render(); });
elEstatus.addEventListener("change", e => { filtro.estatus = e.target.value; render(); });

// Sincronización en vivo (se conecta hasta tener sesión anónima activa)
firebase.auth().onAuthStateChanged(user => {
  if (!user) return;
  col.onSnapshot(snap => {
  snap.docChanges().forEach(ch => {
    const d = ch.doc.data();
    if (ch.type === "removed") { delete estados[d.id]; return; }
    estados[d.id] = {
      optima: d.optima !== false,
      fechaFalla: d.fechaFalla || "",
      numeroReporte: d.numeroReporte || "",
      usuario: d.usuario || ""
    };
  });
  render();
  }, err => console.error(err));
});

document.getElementById("btnExportar").addEventListener("click", () => {
  const filas = TIENDAS.map(t => {
    const est = estados[t.id] || defaultEstado();
    return {
      "ID Tienda": t.id,
      "Tienda": t.nombre,
      "Región": t.region,
      "Zona": t.zona,
      "Estatus": est.optima ? "Óptimas" : "Con fallas",
      "Fecha de la falla": est.fechaFalla || "",
      "N° de reporte": est.numeroReporte || "",
      "Usuario que reporta": est.usuario || ""
    };
  });
  const ws = XLSX.utils.json_to_sheet(filas);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Cámaras Frías");
  const hoy = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `estatus_camaras_frias_${hoy}.xlsx`);
});

render();
</script>
</body>
</html>
